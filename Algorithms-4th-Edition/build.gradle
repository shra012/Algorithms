plugins {
    id 'java'
    id 'application'
}

group 'org.shrvn'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(11)
    }
}

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        url = "https://dl.bintray.com/algs4/maven/"
    }
}

dependencies {
    implementation 'edu.princeton.cs:algs4:1.0.4'
    testImplementation 'junit:junit:4.13.1'
}